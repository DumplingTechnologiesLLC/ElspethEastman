[project]
name = "elspeth-eastman"
version = "0.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "Django==5.2.19",
  "djangorestframework==3.18.3",
  "django-environ==0.14.0",
  "django-cors-headers==4.9.0",
  "django-anymail==15.2",
  "gunicorn==27.0.1",
  "psycopg[binary]==3.3.9",
  "whitenoise==6.12.0",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.5.1,<3"

[dependency-groups]
dev = ["coverage[toml]>=7.13,<8"]

[tool.coverage.run]
branch = true
source = ["core", "config", "manage"]
omit = ["core/tests/*", "core/tests.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
precision = 2
