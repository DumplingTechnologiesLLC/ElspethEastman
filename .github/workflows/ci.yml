name: CI
on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [development, master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm storybook:build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-build
          path: storybook-static
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage-${{ github.event_name }}
          path: coverage/
          retention-days: 7
  backend:
    name: Backend
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: elspeth_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: ci-only-not-a-production-secret
      CONTACT_EMAIL: ci@example.invalid
      DEFAULT_FROM_EMAIL: ci@example.invalid
      DEFAULT_TO_EMAIL: ci@example.invalid
      DEBUG: 'False'
      HEROKU: 'False'
      DEPLOYMENT_ENV: ci
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/elspeth_ci
      PYTHONDONTWRITEBYTECODE: '1'
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pipx install poetry==2.5.1
      - run: poetry check --lock
      - run: poetry sync
      - run: poetry run python -m pip check
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build
      - run: poetry run python manage.py collectstatic --noinput
      - run: poetry run python manage.py check
      - run: poetry run python manage.py makemigrations --check --dry-run
      - run: poetry run python manage.py migrate --noinput
      - run: poetry run python manage.py migrate --noinput
      - run: poetry run coverage run manage.py test --noinput
      - run: poetry run coverage report
      - run: poetry run coverage xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-coverage-${{ github.event_name }}
          path: coverage.xml
          retention-days: 7
  playwright:
    name: Playwright
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2e-only-password
          POSTGRES_DB: elspeth_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      E2E_DATABASE_URL: postgres://postgres:e2e-only-password@127.0.0.1:5432/elspeth_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build
      - uses: actions/download-artifact@v4
        with:
          name: storybook-build
          path: storybook-static
      - run: pnpm test:e2e:docker
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-${{ github.event_name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
